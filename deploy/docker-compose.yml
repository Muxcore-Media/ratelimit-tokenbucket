services:
  ratelimit-tokenbucket:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9800"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: ratelimit-tokenbucket
      RATELIMIT_RATE: "100"
      RATELIMIT_BURST: "200"
      RATELIMIT_ENABLED: "true"
